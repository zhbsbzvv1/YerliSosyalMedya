<!-- FIREBASE SDKs (v10 Modular) -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { 
    getAuth, 
    createUserWithEmailAndPassword, 
    signInWithEmailAndPassword, 
    signInWithPopup, 
    GoogleAuthProvider, 
    onAuthStateChanged, 
    signOut 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
  import { 
    getFirestore, 
    doc, 
    getDoc, 
    setDoc, 
    updateDoc,
    collection, 
    addDoc, 
    query, 
    orderBy, 
    onSnapshot, 
    serverTimestamp 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";

  // SİZİN FIREBASE YAPILANDIRMANIZ
  const firebaseConfig = {
    apiKey: "AIzaSyCahsCXVjAJ-Qx-tHcxDX9xiCdqd4GOv-4",
    authDomain: "zhbsbzvv-6f910.firebaseapp.com",
    projectId: "zhbsbzvv-6f910",
    storageBucket: "zhbsbzvv-6f910.firebasestorage.app",
    messagingSenderId: "1050863909513",
    appId: "1:1050863909513:web:5c149cedd80a77758c6458",
    measurementId: "G-7ZHJ34D9X4"
  };

  // Firebase Başlatma
  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const googleProvider = new GoogleAuthProvider();

  let currentUserData = null;
  let pendingGoogleUser = null;

  // OTURUM DURUMU TAKİBİ
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      // Firestore'dan kullanıcı verisini çek
      const userDocRef = doc(db, "users", user.uid);
      const userDocSnap = await getDoc(userDocRef);

      if (userDocSnap.exists()) {
        currentUserData = userDocSnap.data();
        loadAppInterface();
      } else if (user.providerData[0]?.providerId === 'google.com') {
        // Google ile ilk giriş yapıldıysa Nickname seçme penceresini aç
        pendingGoogleUser = user;
        document.getElementById('google-nickname-modal').style.display = 'flex';
      }
    } else {
      currentUserData = null;
      document.getElementById('auth-screen').style.display = 'block';
      document.getElementById('app-screen').style.display = 'none';
      document.getElementById('google-nickname-modal').style.display = 'none';
    }
  });

  // BENZERSİZ NICKNAME KONTROLÜ
  async function isNicknameTaken(nickname) {
    const nickDocRef = doc(db, "nicknames", nickname.toLowerCase());
    const nickSnap = await getDoc(nickDocRef);
    return nickSnap.exists();
  }

  // E-POSTA VE BENZERSİZ NICKNAME İLE KAYIT
  window.handleEmailRegister = async (e) => {
    e.preventDefault();
    hideAuthAlert();

    const fullName = document.getElementById('reg-fullname').value.trim();
    const nickname = document.getElementById('reg-nickname').value.trim().toLowerCase();
    const email = document.getElementById('reg-email').value.trim();
    const password = document.getElementById('reg-password').value;

    try {
      if (await isNicknameTaken(nickname)) {
        showAuthAlert("Bu nickname zaten başkası tarafından alınmış! Lütfen farklı bir nickname seçin.");
        return;
      }

      const userCred = await createUserWithEmailAndPassword(auth, email, password);
      const uid = userCred.user.uid;

      // Kullanıcı Profilini Firestore'a Kaydet
      await setDoc(doc(db, "users", uid), {
        uid: uid,
        fullName: fullName,
        nickname: nickname,
        email: email,
        createdAt: serverTimestamp()
      });

      // Nickname'i veritabanında rezerve et
      await setDoc(doc(db, "nicknames", nickname), { uid: uid });

    } catch (err) {
      showAuthAlert("Kayıt hatası: " + err.message);
    }
  };

  // E-POSTA İLE GİRİŞ
  window.handleEmailLogin = async (e) => {
    e.preventDefault();
    hideAuthAlert();
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;

    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (err) {
      showAuthAlert("Giriş başarısız: " + err.message);
    }
  };

  // GOOGLE İLE POPUP GİRİŞİ
  window.handleGoogleSignInPopup = async () => {
    hideAuthAlert();
    try {
      const result = await signInWithPopup(auth, googleProvider);
      const user = result.user;

      const userDocRef = doc(db, "users", user.uid);
      const userDocSnap = await getDoc(userDocRef);

      if (!userDocSnap.exists()) {
        pendingGoogleUser = user;
        document.getElementById('google-nickname-modal').style.display = 'flex';
      }
    } catch (err) {
      showAuthAlert("Google Giriş Hatası: " + err.message);
    }
  };

  // GOOGLE GİRİŞİ SONRASI BENZERSİZ NICKNAME KAYDI
  window.handleGoogleNicknameSet = async (e) => {
    e.preventDefault();
    const nickname = document.getElementById('google-nickname-input').value.trim().toLowerCase();
    const alertBox = document.getElementById('google-nick-alert');
    alertBox.style.display = 'none';

    if (!pendingGoogleUser) return;

    try {
      if (await isNicknameTaken(nickname)) {
        alertBox.innerText = "Bu nickname kullanımda! Lütfen başka bir tane girin.";
        alertBox.style.display = 'block';
        return;
      }

      const uid = pendingGoogleUser.uid;
      const fullName = pendingGoogleUser.displayName || "Google Kullanıcısı";
      const email = pendingGoogleUser.email;

      await setDoc(doc(db, "users", uid), {
        uid: uid,
        fullName: fullName,
        nickname: nickname,
        email: email,
        createdAt: serverTimestamp()
      });

      await setDoc(doc(db, "nicknames", nickname), { uid: uid });

      document.getElementById('google-nickname-modal').style.display = 'none';
      
      const userDocSnap = await getDoc(doc(db, "users", uid));
      currentUserData = userDocSnap.data();
      loadAppInterface();

    } catch (err) {
      alertBox.innerText = "Hata: " + err.message;
      alertBox.style.display = 'block';
    }
  };

  // HESAP AYARLARI (İSİM VE NICKNAME DEĞİŞTİRME)
  window.handleUpdateProfile = async (e) => {
    e.preventDefault();
    const newFullName = document.getElementById('set-fullname').value.trim();
    const newNickname = document.getElementById('set-nickname').value.trim().toLowerCase();
    
    const errBox = document.getElementById('settings-alert');
    const succBox = document.getElementById('settings-success');
    errBox.style.display = 'none';
    succBox.style.display = 'none';

    try {
      // Nickname değiştiyse benzersizlik kontrolü yap
      if (newNickname !== currentUserData.nickname) {
        if (await isNicknameTaken(newNickname)) {
          errBox.innerText = "Bu nickname başka bir kullanıcı tarafından alınmış!";
          errBox.style.display = 'block';
          return;
        }

        // Yeni nickname'i kilitlet
        await setDoc(doc(db, "nicknames", newNickname), { uid: currentUserData.uid });
      }

      // Firestore profil verisini güncelle
      await updateDoc(doc(db, "users", currentUserData.uid), {
        fullName: newFullName,
        nickname: newNickname
      });

      currentUserData.fullName = newFullName;
      currentUserData.nickname = newNickname;

      loadAppInterface();
      succBox.innerText = "Profil ayarları başarıyla güncellendi!";
      succBox.style.display = 'block';

    } catch (err) {
      errBox.innerText = "Güncelleme hatası: " + err.message;
      errBox.style.display = 'block';
    }
  };

  // ARAYÜZÜ YÜKLEME
  function loadAppInterface() {
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('app-screen').style.display = 'grid';

    document.getElementById('user-display-name').innerText = currentUserData.fullName;
    document.getElementById('user-nickname-text').innerText = '@' + currentUserData.nickname;
    document.getElementById('user-avatar').innerText = currentUserData.fullName.charAt(0).toUpperCase();

    listenToMessages();
  }

  // SOHBET MESAJI GÖNDERME
  window.sendMessage = async (e) => {
    e.preventDefault();
    const input = document.getElementById('msg-input');
    const text = input.value.trim();
    if (!text || !currentUserData) return;

    input.value = '';
    await addDoc(collection(db, "messages"), {
      text: text,
      senderName: currentUserData.fullName,
      senderNick: currentUserData.nickname,
      senderUid: currentUserData.uid,
      createdAt: serverTimestamp()
    });
  };

  // CANLI SOHBET DİNLEYİCİSİ
  function listenToMessages() {
    const q = query(collection(db, "messages"), orderBy("createdAt", "asc"));
    onSnapshot(q, (snapshot) => {
      const container = document.getElementById('chat-messages');
      container.innerHTML = '';
      snapshot.forEach((docSnap) => {
        const msg = docSnap.data();
        const isSent = msg.senderUid === currentUserData?.uid;

        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${isSent ? 'sent' : 'received'}`;
        msgDiv.innerHTML = `
          <div style="font-size:10px; color:var(--text-muted); margin-left:4px;">${msg.senderName} (@${msg.senderNick})</div>
          <div class="message-bubble">${msg.text}</div>
        `;
        container.appendChild(msgDiv);
      });
      container.scrollTop = container.scrollHeight;
    });
  }

  // MODAL VE SEKMELER
  window.openSettingsModal = () => {
    document.getElementById('set-fullname').value = currentUserData.fullName;
    document.getElementById('set-nickname').value = currentUserData.nickname;
    document.getElementById('settings-alert').style.display = 'none';
    document.getElementById('settings-success').style.display = 'none';
    document.getElementById('settings-modal').style.display = 'flex';
  };

  window.closeSettingsModal = () => {
    document.getElementById('settings-modal').style.display = 'none';
  };

  window.switchAuthTab = (tab) => {
    hideAuthAlert();
    if (tab === 'login') {
      document.getElementById('tab-login').classList.add('active');
      document.getElementById('tab-register').classList.remove('active');
      document.getElementById('form-login').style.display = 'flex';
      document.getElementById('form-register').style.display = 'none';
    } else {
      document.getElementById('tab-register').classList.add('active');
      document.getElementById('tab-login').classList.remove('active');
      document.getElementById('form-login').style.display = 'none';
      document.getElementById('form-register').style.display = 'flex';
    }
  };

  window.handleSignOut = () => signOut(auth);

  function showAuthAlert(msg) {
    const box = document.getElementById('auth-alert');
    box.innerText = msg;
    box.style.display = 'block';
  }

  function hideAuthAlert() {
    document.getElementById('auth-alert').style.display = 'none';
  }
</script>
