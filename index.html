<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TeaSpill - Social & Chat Platform</title>

  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #090a0f;
      --panel-bg: rgba(18, 20, 29, 0.75);
      --panel-border: rgba(255, 255, 255, 0.08);
      --primary: #00f2fe;
      --secondary: #4facfe;
      --accent-purple: #7f00ff;
      --accent-pink: #e100ff;
      --text-main: #f0f2f8;
      --text-muted: #8c93a8;
      --danger: #ff4b5c;
      --success: #00e676;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(127, 0, 255, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(0, 242, 254, 0.12) 0%, transparent 40%);
    }

    /* GLASSMORPHISM CARD */
    .glass-card {
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    /* AUTH VIEW */
    #auth-screen {
      width: 100%;
      max-width: 440px;
      padding: 36px 30px;
      margin: 20px;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .brand-logo i {
      font-size: 28px;
      background: linear-gradient(135deg, var(--primary), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-logo h1 {
      font-weight: 800;
      font-size: 28px;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff, var(--text-muted));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .auth-subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 28px;
    }

    .auth-tabs {
      display: flex;
      background: rgba(255, 255, 255, 0.04);
      padding: 4px;
      border-radius: 14px;
      margin-bottom: 24px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .auth-tab {
      flex: 1;
      padding: 10px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .auth-tab.active {
      background: linear-gradient(135deg, var(--secondary), var(--accent-purple));
      color: #fff;
      box-shadow: 0 4px 15px rgba(79, 172, 254, 0.3);
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .input-group {
      position: relative;
      text-align: left;
    }

    .input-group i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 16px;
    }

    .input-group input {
      width: 100%;
      padding: 14px 16px 14px 48px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: all 0.3s ease;
    }

    .input-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
      background: rgba(255, 255, 255, 0.06);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #000;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 8px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 242, 254, 0.4);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 20px 0;
      color: var(--text-muted);
      font-size: 12px;
    }

    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
    }

    .btn-google {
      width: 100%;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-main);
      font-weight: 600;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-google:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
    }

    /* MAIN APP INTERFACE */
    #app-screen {
      display: none;
      width: 100vw;
      height: 100vh;
      max-width: 1400px;
      max-height: 900px;
      margin: auto;
      grid-template-columns: 280px 360px 1fr;
      gap: 16px;
      padding: 16px;
    }

    /* SIDEBAR */
    .sidebar {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 16px;
    }

    .nav-menu {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 24px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      color: var(--text-muted);
      text-decoration: none;
      border-radius: 14px;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .nav-item:hover, .nav-item.active {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.05);
    }

    .nav-item.active i {
      color: var(--primary);
    }

    .user-profile-badge {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--accent-purple));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #fff;
      position: relative;
    }

    .avatar img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .online-indicator {
      width: 10px;
      height: 10px;
      background: var(--success);
      border: 2px solid var(--bg-dark);
      border-radius: 50%;
      position: absolute;
      bottom: 0;
      right: 0;
    }

    /* CHAT LIST PANEL */
    .chat-list-panel {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }

    .search-box {
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 10px 12px 10px 38px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      color: var(--text-main);
      font-size: 13px;
      outline: none;
    }

    .search-box i {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 14px;
    }

    .chat-items {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .chat-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .chat-item:hover, .chat-item.active {
      background: rgba(255, 255, 255, 0.05);
    }

    .chat-info {
      flex: 1;
      overflow: hidden;
    }

    .chat-name {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 2px;
      display: flex;
      justify-content: space-between;
    }

    .chat-time {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: 400;
    }

    .chat-last-msg {
      font-size: 12px;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* MAIN CHAT WINDOW */
    .chat-window {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-messages {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 65%;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .message.sent {
      align-self: flex-end;
    }

    .message.received {
      align-self: flex-start;
    }

    .message-bubble {
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.4;
    }

    .message.sent .message-bubble {
      background: linear-gradient(135deg, var(--secondary), var(--accent-purple));
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message.received .message-bubble {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-bottom-left-radius: 4px;
    }

    .message-info {
      font-size: 10px;
      color: var(--text-muted);
      align-self: flex-end;
    }

    .chat-input-area {
      padding: 16px 24px;
      border-top: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-input-area input {
      flex: 1;
      padding: 12px 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
    }

    .btn-send {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border: none;
      color: #000;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      transition: all 0.3s ease;
    }

    .btn-send:hover {
      transform: scale(1.05);
    }

    /* ERROR ALERT */
    .alert-box {
      background: rgba(255, 75, 92, 0.15);
      border: 1px solid var(--danger);
      color: #ff8e9b;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }

    @media (max-width: 900px) {
      #app-screen {
        grid-template-columns: 80px 1fr;
      }
      .chat-list-panel { display: none; }
      .sidebar .brand-logo h1, .nav-item span, .user-info { display: none; }
    }
  </style>
</head>
<body>

  <!-- AUTH SCREEN -->
  <div id="auth-screen" class="glass-card">
    <div class="brand-logo">
      <i class="fa-solid fa-mug-hot"></i>
      <h1>TeaSpill</h1>
    </div>
    <p class="auth-subtitle">Gündemi ve sohbeti anında yakala.</p>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">Giriş Yap</button>
      <button class="auth-tab" id="tab-register" onclick="switchAuthTab('register')">Kayıt Ol</button>
    </div>

    <div id="auth-alert" class="alert-box"></div>

    <!-- Login Form -->
    <form id="form-login" class="auth-form" onsubmit="handleEmailAuth(event, 'login')">
      <div class="input-group">
        <i class="fa-regular fa-envelope"></i>
        <input type="email" id="login-email" placeholder="E-Posta Adresi" required>
      </div>
      <div class="input-group">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="login-password" placeholder="Şifre" required>
      </div>
      <button type="submit" class="btn-submit">Giriş Yap</button>
    </form>

    <!-- Register Form -->
    <form id="form-register" class="auth-form" style="display: none;" onsubmit="handleEmailAuth(event, 'register')">
      <div class="input-group">
        <i class="fa-regular fa-user"></i>
        <input type="text" id="reg-name" placeholder="Ad Soyad" required>
      </div>
      <div class="input-group">
        <i class="fa-regular fa-envelope"></i>
        <input type="email" id="reg-email" placeholder="E-Posta Adresi" required>
      </div>
      <div class="input-group">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="reg-password" placeholder="Şifre (En az 6 karakter)" required minlength="6">
      </div>
      <button type="submit" class="btn-submit">Hesap Oluştur</button>
    </form>

    <div class="divider">VEYA</div>

    <button class="btn-google" onclick="handleGoogleSignIn()">
      <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
      Google ile Devam Et
    </button>
  </div>

  <!-- MAIN APP SCREEN -->
  <div id="app-screen">
    <!-- LEFT SIDEBAR -->
    <div class="sidebar glass-card">
      <div>
        <div class="brand-logo">
          <i class="fa-solid fa-mug-hot"></i>
          <h1>TeaSpill</h1>
        </div>
        <div class="nav-menu">
          <a class="nav-item active"><i class="fa-regular fa-comment-dots"></i> <span>Sohbetler</span></a>
          <a class="nav-item"><i class="fa-regular fa-compass"></i> <span>Keşfet</span></a>
          <a class="nav-item"><i class="fa-regular fa-circle-play"></i> <span>Reels</span></a>
          <a class="nav-item"><i class="fa-regular fa-heart"></i> <span>Bildirimler</span></a>
        </div>
      </div>

      <div class="user-profile-badge">
        <div class="avatar" id="user-avatar">
          ?
          <div class="online-indicator"></div>
        </div>
        <div class="user-info" style="flex:1; overflow:hidden;">
          <div id="user-display-name" style="font-size:13px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Kullanıcı</div>
          <div id="user-email-text" style="font-size:11px; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">kullanici@mail.com</div>
        </div>
        <i class="fa-solid fa-right-from-bracket" style="color:var(--text-muted); cursor:pointer;" onclick="handleSignOut()" title="Çıkış Yap"></i>
      </div>
    </div>

    <!-- CHAT LIST -->
    <div class="chat-list-panel glass-card">
      <div style="font-weight:700; font-size:18px;">Mesajlar</div>
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" placeholder="Sohbetlerde ara...">
      </div>
      <div class="chat-items">
        <div class="chat-item active">
          <div class="avatar">#<div class="online-indicator"></div></div>
          <div class="chat-info">
            <div class="chat-name"><span>#genel-sohbet</span> <span class="chat-time">Şimdi</span></div>
            <div class="chat-last-msg">Herkese açık sohbet kanalı</div>
          </div>
        </div>
        <div class="chat-item">
          <div class="avatar">T<div class="online-indicator"></div></div>
          <div class="chat-info">
            <div class="chat-name"><span>#teknoloji</span> <span class="chat-time">10d</span></div>
            <div class="chat-last-msg">Yazılım ve uygulama geliştirme</div>
          </div>
        </div>
      </div>
    </div>

    <!-- MAIN CHAT WINDOW -->
    <div class="chat-window glass-card">
      <div class="chat-header">
        <div style="display:flex; align-items:center; gap:12px;">
          <div class="avatar">#</div>
          <div>
            <div style="font-weight:700; font-size:15px;">#genel-sohbet</div>
            <div style="font-size:11px; color:var(--text-muted);">Canlı Topluluk Odası</div>
          </div>
        </div>
      </div>

      <div class="chat-messages" id="chat-messages">
        <!-- Messages will be injected here dynamically -->
      </div>

      <form class="chat-input-area" onsubmit="sendMessage(event)">
        <input type="text" id="msg-input" placeholder="Mesajınızı yazın..." autocomplete="off">
        <button type="submit" class="btn-send"><i class="fa-solid fa-paper-plane"></i></button>
      </form>
    </div>
  </div>

  <!-- FIREBASE SDKs (v10 Modular) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getAuth, 
      createUserWithEmailAndPassword, 
      signInWithEmailAndPassword, 
      signInWithRedirect, 
      getRedirectResult, 
      GoogleAuthProvider, 
      onAuthStateChanged, 
      signOut,
      updateProfile 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      addDoc, 
      query, 
      orderBy, 
      onSnapshot, 
      serverTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // FIREBASE CONFIGURATION
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const googleProvider = new GoogleAuthProvider();

    let currentUser = null;

    // Handle Google Redirect Result
    getRedirectResult(auth).then((result) => {
      if (result) {
        console.log("Google Login Successful", result.user);
      }
    }).catch((error) => {
      showAlert(error.message);
    });

    // Auth State Observer
    onAuthStateChanged(auth, (user) => {
      if (user) {
        currentUser = user;
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('app-screen').style.display = 'grid';

        // Update UI Profile
        const name = user.displayName || user.email.split('@')[0];
        document.getElementById('user-display-name').innerText = name;
        document.getElementById('user-email-text').innerText = user.email;
        document.getElementById('user-avatar').innerText = name.charAt(0).toUpperCase();

        listenToMessages();
      } else {
        currentUser = null;
        document.getElementById('auth-screen').style.display = 'block';
        document.getElementById('app-screen').style.display = 'none';
      }
    });

    // Email Auth (Login & Register)
    window.handleEmailAuth = async (e, type) => {
      e.preventDefault();
      hideAlert();

      if (type === 'login') {
        const email = document.getElementById('login-email').value;
        const pass = document.getElementById('login-password').value;
        try {
          await signInWithEmailAndPassword(auth, email, pass);
        } catch (err) {
          showAlert("Giriş başarısız: " + err.message);
        }
      } else {
        const name = document.getElementById('reg-name').value;
        const email = document.getElementById('reg-email').value;
        const pass = document.getElementById('reg-password').value;
        try {
          const res = await createUserWithEmailAndPassword(auth, email, pass);
          await updateProfile(res.user, { displayName: name });
        } catch (err) {
          showAlert("Kayıt başarısız: " + err.message);
        }
      }
    };

    // Google Sign In Redirect
    window.handleGoogleSignIn = () => {
      signInWithRedirect(auth, googleProvider);
    };

    // Sign Out
    window.handleSignOut = () => {
      signOut(auth);
    };

    // Send Message to Firestore
    window.sendMessage = async (e) => {
      e.preventDefault();
      const input = document.getElementById('msg-input');
      const text = input.value.trim();
      if (!text || !currentUser) return;

      input.value = '';
      try {
        await addDoc(collection(db, "messages"), {
          text: text,
          senderName: currentUser.displayName || currentUser.email.split('@')[0],
          senderUid: currentUser.uid,
          createdAt: serverTimestamp()
        });
      } catch (err) {
        console.error("Mesaj gönderilemedi:", err);
      }
    };

    // Real-time Chat Listener
    function listenToMessages() {
      const q = query(collection(db, "messages"), orderBy("createdAt", "asc"));
      onSnapshot(q, (snapshot) => {
        const container = document.getElementById('chat-messages');
        container.innerHTML = '';
        snapshot.forEach((doc) => {
          const msg = doc.data();
          const isSent = msg.senderUid === currentUser?.uid;
          
          const msgDiv = document.createElement('div');
          msgDiv.className = `message ${isSent ? 'sent' : 'received'}`;
          msgDiv.innerHTML = `
            <div style="font-size:10px; color:var(--text-muted); margin-left:4px;">${msg.senderName || 'Kullanıcı'}</div>
            <div class="message-bubble">${msg.text}</div>
          `;
          container.appendChild(msgDiv);
        });
        container.scrollTop = container.scrollHeight;
      });
    }

    // UI Helpers
    window.switchAuthTab = (tab) => {
      hideAlert();
      if (tab === 'login') {
        document.getElementById('tab-login').classList.add('active');
        document.getElementById('tab-register').classList.remove('active');
        document.getElementById('form-login').style.display = 'flex';
        document.getElementById('form-register').style.display = 'none';
      } else {
        document.getElementById('tab-register').classList.add('active');
        document.getElementById('tab-login').classList.remove('active');
        document.getElementById('form-login').style.display = 'none';
        document.getElementById('form-register').style.display = 'flex';
      }
    };

    function showAlert(msg) {
      const box = document.getElementById('auth-alert');
      box.innerText = msg;
      box.style.display = 'block';
    }

    function hideAlert() {
      document.getElementById('auth-alert').style.display = 'none';
    }
  </script>
</body>
</html>
