<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yankı - Google ile Giriş</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #101018;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 90%;
            max-width: 400px;
            padding: 32px;
            background: #1c1c29;
            border: 1px solid #333347;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 15px 50px #0005;
        }

        .logo {
            font-size: 38px;
            font-weight: bold;
            color: #a78bfa;
            margin-bottom: 10px;
        }

        h2 {
            margin-bottom: 10px;
        }

        p {
            color: #b8b8c9;
            line-height: 1.5;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 12px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        #googleLogin {
            background: white;
            color: #222;
        }

        #logout {
            background: #7c3aed;
            color: white;
        }

        button:disabled {
            opacity: 0.6;
            cursor: wait;
        }

        #profile {
            display: none;
            margin-top: 25px;
        }

        #avatar {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #a78bfa;
        }

        #userName {
            overflow-wrap: anywhere;
        }

        #userEmail {
            overflow-wrap: anywhere;
        }

        #status {
            font-size: 14px;
            margin-top: 18px;
            overflow-wrap: anywhere;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">YANKI</div>

        <h2>Yankı'ya Hoş Geldin</h2>

        <p>
            Google hesabınla giriş yap ve sosyal dünyaya katıl.
        </p>

        <button id="googleLogin">
            Google ile giriş yap
        </button>

        <div id="profile">

            <img id="avatar" src="" alt="Profil fotoğrafı">

            <h2 id="userName"></h2>

            <p id="userEmail"></p>

            <p id="userUid"></p>

            <button id="logout">
                Çıkış yap
            </button>

        </div>

        <p id="status"></p>

    </div>

    <script type="module">

        import { initializeApp }
            from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

        import {
            getAuth,
            GoogleAuthProvider,
            signInWithPopup,
            signOut,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";


        // FIREBASE PROJE BİLGİLERİ

        const firebaseConfig = {
            apiKey: "AIzaSyDxuNuS-DJ_d4Fyn-X9-9u_X4NawKes-dMY",
            authDomain: "zhbsbzvv1-a7db1.firebaseapp.com",
            projectId: "zhbsbzvv1-a7db1",
            storageBucket: "zhbsbzvv1-a7db1.firebasestorage.app",
            messagingSenderId: "436517529062",
            appId: "1:436517529062:web:d7412c0eadcc843604a227",
            measurementId: "G-Q3NNYV89ER"
        };


        // FIREBASE BAŞLAT

        const app = initializeApp(firebaseConfig);

        const auth = getAuth(app);

        const provider = new GoogleAuthProvider();

        provider.setCustomParameters({
            prompt: "select_account"
        });


        // HTML ELEMANLARI

        const googleLoginButton =
            document.getElementById("googleLogin");

        const logoutButton =
            document.getElementById("logout");

        const profile =
            document.getElementById("profile");

        const avatar =
            document.getElementById("avatar");

        const userName =
            document.getElementById("userName");

        const userEmail =
            document.getElementById("userEmail");

        const userUid =
            document.getElementById("userUid");

        const status =
            document.getElementById("status");


        // GOOGLE İLE GİRİŞ

        googleLoginButton.addEventListener("click", async () => {

            googleLoginButton.disabled = true;

            status.textContent = "Google giriş ekranı açılıyor...";

            try {

                const result = await signInWithPopup(
                    auth,
                    provider
                );

                const user = result.user;

                console.log("Kullanıcı UID:", user.uid);
                console.log("E-posta:", user.email);
                console.log("Ad:", user.displayName);
                console.log("Fotoğraf:", user.photoURL);

                status.textContent = "Giriş başarılı!";

            } catch (error) {

                console.error("Google giriş hatası:", error);

                if (error.code === "auth/popup-closed-by-user") {

                    status.textContent =
                        "Giriş penceresi kapatıldı.";

                } else if (
                    error.code === "auth/unauthorized-domain"
                ) {

                    status.textContent =
                        "Bu alan adı Firebase'de yetkilendirilmemiş.";

                } else if (
                    error.code === "auth/operation-not-allowed"
                ) {

                    status.textContent =
                        "Firebase Console'dan Google girişini etkinleştir.";

                } else {

                    status.textContent =
                        "Giriş başarısız: " + error.message;

                }

            } finally {

                googleLoginButton.disabled = false;

            }

        });


        // OTURUMU KAPAT

        logoutButton.addEventListener("click", async () => {

            try {

                await signOut(auth);

                status.textContent = "Oturum kapatıldı.";

            } catch (error) {

                console.error("Çıkış hatası:", error);

                status.textContent =
                    "Çıkış yapılamadı: " + error.message;

            }

        });


        // KULLANICI GİRİŞ DURUMUNU TAKİP ET

        onAuthStateChanged(auth, (user) => {

            if (user) {

                googleLoginButton.classList.add("hidden");

                profile.style.display = "block";

                avatar.src =
                    user.photoURL ||
                    "https://www.gravatar.com/avatar/?d=mp";

                userName.textContent =
                    user.displayName || "İsimsiz kullanıcı";

                userEmail.textContent =
                    user.email || "E-posta bulunamadı";

                userUid.textContent =
                    "Kullanıcı ID: " + user.uid;

                status.textContent = "Hesabın açık.";

            } else {

                googleLoginButton.classList.remove("hidden");

                profile.style.display = "none";

                avatar.src = "";

                userName.textContent = "";

                userEmail.textContent = "";

                userUid.textContent = "";

            }

        });

    </script>

</body>
</html>
