<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flow - Social & Chat Platform</title>

  <!-- Google Fonts & FontAwesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --bg-dark: #090a0f;
      --panel-bg: rgba(18, 20, 29, 0.85);
      --panel-border: rgba(255, 255, 255, 0.08);
      --primary: #00f2fe;
      --secondary: #4facfe;
      --accent-purple: #7f00ff;
      --text-main: #f0f2f8;
      --text-muted: #8c93a8;
      --danger: #ff4b5c;
      --success: #00e676;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow-x: hidden;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(127, 0, 255, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 85% 85%, rgba(0, 242, 254, 0.12) 0%, transparent 40%);
    }

    .glass-card {
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    .auth-container {
      width: 100%;
      max-width: 440px;
      padding: 36px 30px;
      margin: 20px;
      text-align: center;
      position: relative;
      z-index: 10;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 8px;
    }

    .brand-logo i {
      font-size: 28px;
      background: linear-gradient(135deg, var(--primary), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-logo h1 {
      font-weight: 800;
      font-size: 32px;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #ffffff, var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .auth-subtitle {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 24px;
    }

    .auth-tabs {
      display: flex;
      background: rgba(255, 255, 255, 0.04);
      padding: 4px;
      border-radius: 14px;
      margin-bottom: 20px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .auth-tab {
      flex: 1;
      padding: 10px;
      font-size: 14px;
      font-weight: 600;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .auth-tab.active {
      background: linear-gradient(135deg, var(--secondary), var(--accent-purple));
      color: #fff;
      box-shadow: 0 4px 15px rgba(79, 172, 254, 0.3);
    }

    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .input-group {
      position: relative;
      text-align: left;
    }

    .input-group i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      font-size: 15px;
    }

    .input-group input {
      width: 100%;
      padding: 14px 16px 14px 48px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
      transition: all 0.3s ease;
    }

    .input-group input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
      background: rgba(255, 255, 255, 0.06);
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: #000;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 6px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 242, 254, 0.4);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 18px 0;
      color: var(--text-muted);
      font-size: 12px;
    }

    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: rgba(255, 255, 255, 0.08);
    }

    .btn-google {
      width: 100%;
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.04);
      color: var(--text-main);
      font-weight: 600;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .btn-google:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.2);
    }

    #app-screen {
      display: none;
      width: 100vw;
      height: 100vh;
      max-width: 1400px;
      max-height: 900px;
      margin: auto;
      grid-template-columns: 280px 360px 1fr;
      gap: 16px;
      padding: 16px;
    }

    .sidebar {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 16px;
    }

    .nav-menu {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-top: 24px;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      color: var(--text-muted);
      text-decoration: none;
      border-radius: 14px;
      font-weight: 600;
      font-size: 14px;
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .nav-item:hover, .nav-item.active {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.05);
    }

    .nav-item.active i {
      color: var(--primary);
    }

    .user-profile-badge {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 16px;
      cursor: pointer;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--accent-purple));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #fff;
    }

    .chat-list-panel {
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
    }

    .chat-window {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .chat-header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .chat-messages {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 65%;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .message.sent { align-self: flex-end; }
    .message.received { align-self: flex-start; }

    .message-bubble {
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.4;
    }

    .message.sent .message-bubble {
      background: linear-gradient(135deg, var(--secondary), var(--accent-purple));
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .message.received .message-bubble {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-bottom-left-radius: 4px;
    }

    .chat-input-area {
      padding: 16px 24px;
      border-top: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .chat-input-area input {
      flex: 1;
      padding: 12px 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      color: var(--text-main);
      font-size: 14px;
      outline: none;
    }

    .btn-send {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      border: none;
      color: #000;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }

    .alert-box {
      background: rgba(255, 75, 92, 0.15);
      border: 1px solid var(--danger);
      color: #ff8e9b;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 14px;
      display: none;
    }

    .success-box {
      background: rgba(0, 230, 118, 0.15);
      border: 1px solid var(--success);
      color: #76ff03;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      margin-bottom: 14px;
      display: none;
    }
  </style>
</head>
<body>

  <!-- AUTH SCREEN -->
  <div id="auth-screen" class="auth-container glass-card">
    <div class="brand-logo">
      <i class="fa-solid fa-wind"></i>
      <h1>Flow</h1>
    </div>
    <p class="auth-subtitle">Kesintisiz sohbet ve akışın adresi.</p>

    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" onclick="switchAuthTab('login')">Giriş Yap</button>
      <button class="auth-tab" id="tab-register" onclick="switchAuthTab('register')">Kayıt Ol</button>
    </div>

    <div id="auth-alert" class="alert-box"></div>

    <!-- Login Form -->
    <form id="form-login" class="auth-form" onsubmit="handleEmailLogin(event)">
      <div class="input-group">
        <i class="fa-regular fa-envelope"></i>
        <input type="email" id="login-email" placeholder="E-Posta Adresi" required>
      </div>
      <div class="input-group">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="login-password" placeholder="Şifre" required>
      </div>
      <button type="submit" class="btn-submit">Giriş Yap</button>
    </form>

    <!-- Register Form -->
    <form id="form-register" class="auth-form" style="display: none;" onsubmit="handleEmailRegister(event)">
      <div class="input-group">
        <i class="fa-regular fa-user"></i>
        <input type="text" id="reg-fullname" placeholder="Ad Soyad" required>
      </div>
      <div class="input-group">
        <i class="fa-solid fa-at"></i>
        <input type="text" id="reg-nickname" placeholder="Nickname" required>
      </div>
      <div class="input-group">
        <i class="fa-regular fa-envelope"></i>
        <input type="email" id="reg-email" placeholder="E-Posta Adresi" required>
      </div>
      <div class="input-group">
        <i class="fa-solid fa-lock"></i>
        <input type="password" id="reg-password" placeholder="Şifre" required>
      </div>
      <button type="submit" class="btn-submit">Hesap Oluştur</button>
    </form>

    <div class="divider">VEYA</div>

    <button class="btn-google" onclick="handleGoogleSignInPopup()">
