
<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flow Bakımda</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        flow: {
                            bg: '#0b132b',
                            card: '#1c2541',
                            sub: '#3a506b',
                            cyan: '#00b4d8',
                            glow: '#4cc9f0'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #0b132b;
            color: #f8fafc;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        /* Ambient Glowing Orbs */
        .glow-orb-primary {
            position: absolute;
            border-radius: 50%;
            filter: blur(150px);
            z-index: 0;
            pointer-events: none;
            opacity: 0.35;
        }

        .glow-orb-secondary {
            position: absolute;
            border-radius: 50%;
            filter: blur(130px);
            z-index: 0;
            pointer-events: none;
            opacity: 0.25;
        }

        /* Grid Texture Overlay */
        .bg-grid {
            background-size: 60px 60px;
            background-image: 
                linear-gradient(to right, rgba(255, 255, 255, 0.018) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.018) 1px, transparent 1px);
        }

        /* Title Soft Glow Effect */
        .text-glow {
            text-shadow: 0 0 35px rgba(0, 180, 216, 0.35);
        }

        /* Pulsing Dots Animation */
        .dot-1 { animation: dotPulse 1.5s infinite 0.0s; }
        .dot-2 { animation: dotPulse 1.5s infinite 0.25s; }
        .dot-3 { animation: dotPulse 1.5s infinite 0.5s; }

        @keyframes dotPulse {
            0%, 100% { 
                opacity: 0.2; 
                transform: translateY(0); 
            }
            50% { 
                opacity: 1; 
                transform: translateY(-2px); 
                color: #4cc9f0;
            }
        }
    </style>
</head>
<body class="min-h-screen w-full flex items-center justify-center relative bg-grid select-none overflow-hidden">

    <!-- Ambient Gradient Background Lights -->
    <div class="glow-orb-primary w-[550px] h-[550px] bg-[#00b4d8] top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2"></div>
    <div class="glow-orb-secondary w-[400px] h-[400px] bg-[#4cc9f0] top-1/3 left-1/2 -translate-x-1/2 -translate-y-1/2"></div>

    <!-- Background Particle Canvas -->
    <canvas id="particleCanvas" class="fixed inset-0 pointer-events-none z-0"></canvas>

    <!-- Main Content Box -->
    <main class="relative z-10 flex flex-col items-center justify-center text-center px-6 max-w-3xl">
        <!-- Main Title -->
        <h1 class="text-3xl sm:text-5xl md:text-6xl lg:text-7xl font-extrabold tracking-tight text-white text-glow flex items-center justify-center">
            <span>Flow Bakımda</span>
            <span class="inline-flex ml-2 sm:ml-3 gap-1 sm:gap-1.5 text-flow-cyan">
                <span class="dot-1">•</span>
                <span class="dot-2">•</span>
                <span class="dot-3">•</span>
            </span>
        </h1>

        <!-- Subtitle -->
        <p class="mt-4 sm:mt-6 text-base sm:text-xl md:text-2xl font-normal text-slate-400 tracking-wide">
            Birkaç Dakika Sonra Tekrar Deneyin
        </p>
    </main>

    <!-- Subtle Floating Canvas Particles JS -->
    <script>
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.radius = Math.random() * 1.5 + 0.5;
                this.vx = (Math.random() - 0.5) * 0.15;
                this.vy = (Math.random() - 0.5) * 0.15;
                this.alpha = Math.random() * 0.35 + 0.1;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = '#00b4d8';
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        for (let i = 0; i < 45; i++) {
            particles.push(new Particle());
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach(p => {
                p.update();
                p.draw();
            });
            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
