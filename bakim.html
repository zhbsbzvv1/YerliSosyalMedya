<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flow - Bakım Çalışması</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #090a0f;
      --panel-bg: rgba(18, 20, 29, 0.7);
      --panel-border: rgba(255, 255, 255, 0.08);
      --primary: #00f2fe;
      --secondary: #4facfe;
      --accent-purple: #7f00ff;
      --text-main: #f0f2f8;
      --text-muted: #8c93a8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      /* Flow temasına uygun neon arka plan ışıklandırması */
      background-image: 
        radial-gradient(circle at 20% 20%, rgba(127, 0, 255, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(0, 242, 254, 0.15) 0%, transparent 50%);
    }

    .maintenance-container {
      width: 100%;
      max-width: 500px;
      padding: 50px 40px;
      margin: 20px;
      text-align: center;
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--panel-border);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255,255,255,0.05);
      animation: float 6s ease-in-out infinite;
    }

    .logo-wrapper {
      margin-bottom: 30px;
      position: relative;
      display: inline-block;
    }

    /* Görselin etrafına parlama efekti veren gölge */
    .logo-image {
      width: 140px;
      height: 140px;
      border-radius: 32px;
      object-fit: cover;
      box-shadow: 0 0 30px rgba(0, 242, 254, 0.4), 0 0 60px rgba(127, 0, 255, 0.3);
      animation: pulse 3s infinite alternate;
    }

    h1 {
      font-weight: 800;
      font-size: 32px;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #ffffff, var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    p {
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 35px;
    }

    /* Yükleniyor (Loading) Animasyonu */
    .loader-dots {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .loader-dots div {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--accent-purple));
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .loader-dots div:nth-child(1) { animation-delay: -0.32s; }
    .loader-dots div:nth-child(2) { animation-delay: -0.16s; }

    /* Animasyon Keyframeleri */
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 20px rgba(0, 242, 254, 0.3), 0 0 40px rgba(127, 0, 255, 0.2); }
      100% { box-shadow: 0 0 40px rgba(0, 242, 254, 0.6), 0 0 80px rgba(127, 0, 255, 0.5); }
    }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
      40% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="maintenance-container">
    <div class="logo-wrapper">
      <!-- Sizin için oluşturduğum logonun dosyası buraya çağrılıyor -->
      <img src="watermarked_img_11297910894081898016.jpg" alt="Flow Logo" class="logo-image">
    </div>
    
    <h1>Sistem Bakımda</h1>
    
    <p>Flow platformunda sizlere daha iyi ve kesintisiz bir deneyim sunabilmek için kısa süreli bir altyapı çalışması gerçekleştiriyoruz. Lütfen daha sonra tekrar ziyaret ediniz.</p>
    
    <div class="loader-dots">
      <div></div>
      <div></div>
      <div></div>
    </div>
  </div>

</body>
</html>
