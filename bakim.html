<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flow - Bakım Çalışması</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #090a0f;
      --panel-bg: rgba(18, 20, 29, 0.7);
      --panel-border: rgba(255, 255, 255, 0.08);
      --primary: #00f2fe;
      --secondary: #4facfe;
      --accent-purple: #7f00ff;
      --text-main: #f0f2f8;
      --text-muted: #8c93a8;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      background-image: 
        radial-gradient(circle at 20% 20%, rgba(127, 0, 255, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 80%, rgba(0, 242, 254, 0.15) 0%, transparent 50%);
    }

    .maintenance-container {
      width: 100%;
      max-width: 500px;
      padding: 50px 40px;
      margin: 20px;
      text-align: center;
      background: var(--panel-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--panel-border);
      border-radius: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255,255,255,0.05);
      animation: float 6s ease-in-out infinite;
    }

    .logo-wrapper {
      margin-bottom: 30px;
      display: flex;
      justify-content: center;
    }

    /* Kırılmaz ve Parlayan SVG Logosu */
    .logo-svg {
      width: 130px;
      height: 130px;
      animation: pulse 3s infinite alternate;
    }

    h1 {
      font-weight: 800;
      font-size: 32px;
      margin-bottom: 16px;
      background: linear-gradient(135deg, #ffffff, var(--primary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    p {
      color: var(--text-muted);
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 35px;
    }

    .loader-dots {
      display: flex;
      justify-content: center;
      gap: 10px;
    }

    .loader-dots div {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--accent-purple));
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .loader-dots div:nth-child(1) { animation-delay: -0.32s; }
    .loader-dots div:nth-child(2) { animation-delay: -0.16s; }

    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0px); }
    }

    @keyframes pulse {
      0% { filter: drop-shadow(0 0 15px rgba(0, 242, 254, 0.3)) drop-shadow(0 0 30px rgba(127, 0, 255, 0.2)); }
      100% { filter: drop-shadow(0 0 35px rgba(0, 242, 254, 0.7)) drop-shadow(0 0 70px rgba(127, 0, 255, 0.6)); }
    }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
      40% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="maintenance-container">
    
    <div class="logo-wrapper">
      <!-- Dışarıdan dosyaya ihtiyaç duymayan SVG Kodlu Logo -->
      <svg class="logo-svg" viewBox="0 0 42 42" fill="none" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="flowLogoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#00f2fe" />
            <stop offset="50%" stop-color="#4facfe" />
            <stop offset="100%" stop-color="#7f00ff" />
          </linearGradient>
        </defs>
        <path d="M21 2C10.5 2 2 10.5 2 21C2 24.5 3.1 27.8 5 30.5L3 38C2.8 38.8 3.2 39.2 4 39L11.5 37C14.2 38.9 17.5 40 21 40C31.5 40 40 31.5 40 21C40 10.5 31.5 2 21 2Z" fill="url(#flowLogoGrad)" opacity="0.15"/>
        <path d="M12 21C12 16.5 15.5 13 20 13C25 13 28.5 16 30 20.5" stroke="url(#flowLogoGrad)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M30 21C30 25.5 26.5 29 22 29C17 29 13.5 26 12 21.5" stroke="#7f00ff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="21" cy="21" r="3.5" fill="#ffffff" />
      </svg>
    </div>
    
    <h1>Sistem Bakımda</h1>
    
    <p>Flow platformunda sizlere daha iyi ve kesintisiz bir deneyim sunabilmek için kısa süreli bir altyapı çalışması gerçekleştiriyoruz. Lütfen daha sonra tekrar ziyaret ediniz.</p>
    
    <div class="loader-dots">
      <div></div>
      <div></div>
      <div></div>
    </div>
  </div>

</body>
</html>
